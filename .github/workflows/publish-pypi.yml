# Publishes clients/python to PyPI via Trusted Publishing (OIDC).
# No API token anywhere, PyPI trusts this repo+workflow identity directly.
#
# First-time setup (one-time, in Megan's PyPI account):
#   PyPI → Account → Publishing → "Add a new pending publisher"
#     project: tempguru · owner: Tempguru-co · repo: tempguru-mcp
#     workflow: publish-pypi.yml · environment: (leave blank)
#
# Release flow: bump version in clients/python/pyproject.toml, then either
# push a tag like python-v0.1.0 or run this workflow manually.

name: Publish Python client to PyPI

on:
  push:
    tags:
      - "python-v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build clients/python --outdir dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
