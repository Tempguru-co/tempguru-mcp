name: check-submissions

# Drift gate: fails if the submission/distribution artifacts (MCP registry
# manifest, Docker MCP catalog, Postman, Context7, Dockerfile, Glama) fall out of
# sync with the canonical market count + MCP tool set. These files are
# hand-maintained, so this catches the "300+ markets / missing tools" drift in
# review instead of after publishing.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check-submissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:submissions

  # Quality gate: typecheck + the MCP eval suite + the pure-logic unit tests.
  # Previously none of these ran in CI, so a type error or a behavior regression
  # (e.g. a tool/schema drift) could merge silently. Runs on the same triggers.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:stdio
      - run: npm run test:unit
      - run: npm run evals
      # Generated artifacts (OKF bundle, llms.txt, openapi.json, skill digests)
      # must be committed in sync with their sources: regenerate and require a
      # clean tree, so "forgot to run build:okf" can't merge as silent drift.
      - run: npm run build
      - run: npm run build:worker
      # PR verification must be deterministic and network-independent. The
      # explicit live refresh remains a maintainer/deployment canary.
      - run: npm run build:llms-worker -- --from-committed
      - run: git diff --exit-code -- public content skills plugins/tempguru/skills distribution/pi/skills cloudflare/worker.js cloudflare/llms-worker.js
      - run: npm run build:cli
      - run: npm run check:cli-package
