name: Publish MCP CLI to npm

# One-time npm setup: configure `tempguru-mcp` trusted publishing for
# Tempguru-co/tempguru-mcp, this exact workflow filename, Environment
# `Production`, and allowed action `npm publish`. Publishing is manual so
# merging a draft product PR cannot release a package by accident.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact semver already committed to package.json, cli/package.json, and server.json
        required: true
        type: string

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: publish-tempguru-mcp-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm install --global "npm@^11.15.0"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build:stdio
      - run: npm run evals
      - run: npm run test:protocol
      - run: npm run build
      - run: npm run check:submissions
      - run: npm run build:cli
      - run: npm run check:cli-package
      - name: Verify release versions and package contents
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ROOT=$(node -p 'require("./package.json").version')
          CLI=$(node -p 'require("./cli/package.json").version')
          REGISTRY=$(node -p 'require("./server.json").version')
          test "$ROOT" = "$RELEASE_VERSION"
          test "$ROOT" = "$CLI"
          test "$ROOT" = "$REGISTRY"
          npm pack --dry-run --json ./cli
          if [ "$(npm view "tempguru-mcp@$RELEASE_VERSION" version 2>/dev/null || true)" = "$RELEASE_VERSION" ]; then
            echo "::notice::tempguru-mcp@$RELEASE_VERSION is already published; skipping the immutable npm write and re-dispatching the Registry check."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish with npm trusted publishing
        if: steps.release.outputs.already_published != 'true'
        working-directory: cli
        run: npm publish --access public
      - name: Publish the same version to the MCP Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-registry.yml --repo "$GITHUB_REPOSITORY" --ref main
