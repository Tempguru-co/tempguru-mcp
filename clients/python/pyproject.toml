[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tempguru"
version = "0.3.0"
description = "Event staffing data for AI agents and apps across 300+ U.S. and Canadian markets, backed by 5,000+ events and 100,000+ completed shifts, with live rates, saved plans, compliance, and quote submission."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "TempGuru (Temporary Assistance Guru, Inc.)", email = "megan@tempguru.co" }]
keywords = [
  "event staffing",
  "events",
  "staffing",
  "temp staff",
  "brand ambassadors",
  "trade show",
  "ai agents",
  "llm tools",
  "function calling",
  "mcp",
  "labor compliance",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
llamaindex = ["llama-index-core>=0.12"]

[project.urls]
Homepage = "https://tempguru.co"
Documentation = "https://tempguru.co/ai-agents"
Source = "https://github.com/Tempguru-co/tempguru-mcp"
"API Reference (OpenAPI)" = "https://mcp.tempguru.co/openapi.json"
"MCP Server" = "https://mcp.tempguru.co/mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/tempguru"]
