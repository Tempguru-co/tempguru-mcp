# Docker MCP Catalog submission for TempGuru Event Staffing
#
# Submit as a PR to: https://github.com/docker/mcp-catalog
# (verify the exact YAML schema from Docker's submission guide before filing)
#
# GHCR image: ghcr.io/tempguru-co/event-staffing
# GitHub CI workflow: .github/workflows/docker.yml publishes `latest` + `sha-*`
# from main and semver tags from `v*` Git tags.
#
# Steps before filing PR:
#   1. Merge to main and confirm the GHCR `latest` image is public and pullable
#   2. Push the matching `vX.Y.Z` Git tag and confirm the `X.Y.Z` image exists
#   3. Copy this file into the docker/mcp-catalog repo at the path their CONTRIBUTING says

name: tempguru-event-staffing
title: TempGuru Event Staffing
description: |
  W-2 event staffing data for AI agents across 345 US and Canadian markets.
  Twelve tools include ten read-only operations that surface city coverage, staffing roles,
  all-inclusive hourly rates, saved plans, booking policies, quote status,
  lead-time availability, state-level compliance summaries, and a non-PII
  buyer quote-form handoff. In Phase A,
  the non-destructive plan_staffing tool may best-effort save a 30-day non-PII
  snapshot; save_staffing_plan is the explicit non-contact write used only when
  a complete plan has no plan_id and persistence is needed, never to duplicate a save.
  request_quote is read-only: it resolves a saved plan_id into a prefilled
  TempGuru-owned form URL and never accepts contact details or creates a lead or
  TG reference. The buyer reviews and submits that form personally.

  TempGuru hires all event workers as W-2 employees, payroll taxes, workers'
  comp, and general liability are TempGuru's responsibility, not the customer's.

publisher:
  name: Temporary Assistance Guru, Inc.
  url: https://tempguru.co
  email: megan@tempguru.co

image: ghcr.io/tempguru-co/event-staffing:latest

transport:
  type: streamable-http
  url: https://mcp.tempguru.co/mcp

authentication:
  required: false

categories:
  - staffing
  - hr
  - events
  - enterprise
  - compliance

tags:
  - event-staffing
  - w2
  - brand-ambassadors
  - tradeshow
  - conventions
  - workforce

registry:
  mcp: https://registry.modelcontextprotocol.io/v0/servers/co.tempguru/event-staffing
  smithery: https://smithery.ai/server/tempguru/event-staffing
  modelscope: https://modelscope.cn/mcp/servers/tempguru/TempGuru-Event-Staffing/

links:
  - url: https://tempguru.co
    label: Website
  - url: https://mcp.tempguru.co/
    label: Documentation
  - url: https://github.com/tempguru-co/tempguru-mcp
    label: Source
  - url: https://mcp.tempguru.co/openapi.json
    label: OpenAPI 3.1

tools:
  - name: plan_staffing
    description: >
      Call first. Turns an event description (city, date, headcount, roles) into a
      complete staffing plan: role coverage, per-role all-inclusive W-2 rate math,
      lead-time guidance, state compliance flags, and recommended next steps.
      Planning estimates only, not a binding quote. May best-effort save a
      30-day non-PII snapshot; retain any returned plan_id.
    readOnly: false

  - name: save_staffing_plan
    description: >
      Explicitly save a server-recomputed, complete non-contact staffing plan
      for 30 days. Use once only when plan_staffing returned no plan_id and a
      resumable or shareable plan is needed; never duplicate an existing save.
      Does not reserve staff, collect contact details, or request a quote.
    readOnly: false

  - name: get_plan
    description: >
      Restore a non-PII staffing plan saved by plan_staffing or
      save_staffing_plan within the last 30 days.
    readOnly: true

  - name: get_cities
    description: >
      List all cities TempGuru serves (345 US/CA markets), optionally filtered
      by state or market tier (hub / mid / small).
    readOnly: true

  - name: get_roles
    description: >
      List all event staffing roles with descriptions and skill tiers, brand ambassadors, registration, hospitality, setup/breakdown, ushers, and more.
    readOnly: true

  - name: check_availability
    description: >
      Lead-time guidance for a city + date. Returns a recommendation (yes / tight /
      rush / very-rush) based on market tier and days until event. Planning guidance
      only, not a real-time inventory check.
    readOnly: true

  - name: get_role_pricing
    description: >
      All-inclusive hourly rate range (low–high) for a specific role in a specific city.
      Covers worker pay, payroll taxes, workers' comp, general liability, and coordinator
      support. Brand Ambassadors floor at $40/hr in every market.
    readOnly: true

  - name: get_compliance_by_state
    description: >
      State-level employment compliance summary: minimum wage, overtime thresholds,
      and state-specific quirks (CA meal breaks, NY spread-of-hours, etc.).
      Informational only, not legal advice.
    readOnly: true

  - name: get_policies
    description: >
      Published booking and procurement policies, with unsupported values explicitly
      marked for coordinator confirmation instead of invented.
    readOnly: true

  - name: get_rate_benchmark
    description: >
      The Rate Index: a full benchmark table of all-inclusive W-2 hourly rates by
      role (typical + national range; Brand Ambassadors by tier), with a citation line.
      Informational benchmark, not a binding quote.
    readOnly: true

  - name: get_quote_status
    description: >
      Check a TG quote reference created after the buyer personally submits the
      TempGuru website form, or a historical REST-created reference. The MCP
      request_quote handoff does not create a reference.
    readOnly: true

  - name: request_quote
    description: >
      Read-only, idempotent, non-PII buyer handoff. Requires a saved plan_id and
      accepts only optional allowlisted platform/skill attribution, then returns a
      prefilled TempGuru-owned form_url. It never collects or transmits contact
      details, writes to the CRM, or creates a TG reference. The buyer must open
      the form, review the plan, enter their own contact details, and submit it
      personally. If no plan_id was saved, use the plan's continuation.form_url
      directly instead.
    readOnly: true
